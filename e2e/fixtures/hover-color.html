<!doctype html><meta charset=utf-8><title>hover color</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
  .stack { display: flex; flex-direction: column; align-items: flex-start; }
  .btn { border: 0; padding: 8px 16px; background: rgb(240, 240, 240); }
  .btn:hover { background: rgb(200, 200, 200); }
</style>
<div class="stack">
  <button class="btn" data-testid="a">A</button>
  <button class="btn" data-testid="b">B</button>
</div>
