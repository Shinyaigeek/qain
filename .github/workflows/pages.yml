name: Pages

# Regenerates the live site (https://shinyaigeek.github.io/qain/): the demo —
# snap the example billing page and its regressed variant, publish the replay
# diff, the HTML report, the raw snapshots, the shot PNGs — plus the in-browser
# playground under /playground/ and docs/ rendered to HTML under /docs/.

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "packages/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm browsers --with-deps

      - name: Capture the demo
        run: |
          node examples/app/server.mjs &
          for i in $(seq 1 50); do curl -sf http://localhost:5600/ > /dev/null && break; sleep 0.2; done

          qain="node packages/cli/dist/index.js"
          mkdir -p site
          $qain snap 'http://localhost:5600/' --states hover --rules --replay -o site/before.json
          $qain snap 'http://localhost:5600/?variant=regressed' --states hover --rules --replay -o site/after.json

          # Exit code 1 is the diff being non-empty — here, the expected outcome.
          $qain diff site/before.json site/after.json \
            --no-color --html site/report.html --replay site/replay.html \
            > site/diff.txt || [ $? -eq 1 ]

          $qain shot site/before.json site/after.json -o site
          cp examples/demo/index.html site/index.html

      - name: Assemble the browser playground
        run: node scripts/build-playground.mjs site/playground

      - name: Render the docs
        run: node scripts/build-docs.mjs site/docs

      - name: Emit llms.txt
        run: node scripts/build-llms.mjs site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
