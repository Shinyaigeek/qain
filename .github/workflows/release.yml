name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A release tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm has no undo.
      - name: Tag matches the version of every published package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for pkg in core playwright vitest storybook cli; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$TAG" != "v$version" ]; then
              echo "::error::release tag $TAG does not match packages/$pkg version v$version"
              exit 1
            fi
          done

      - run: pnpm build
      - run: pnpm browsers --with-deps
      - run: pnpm test
      - run: pnpm demo

      # -r skips the private packages (root, e2e, examples) on its own.
      # `access: public` for the scoped packages comes from their publishConfig.
      - run: pnpm publish -r --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
