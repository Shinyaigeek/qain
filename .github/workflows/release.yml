name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A release tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm has no undo.
      - name: Tag matches the version of every published package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Derived from the directory rather than a hand-kept list: a new package
          # that nobody remembered to add here would otherwise publish unchecked.
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./$manifest').private === true")" = "true" ]; then
              continue
            fi
            version=$(node -p "require('./$manifest').version")
            if [ "$TAG" != "v$version" ]; then
              echo "::error::release tag $TAG does not match $manifest version v$version"
              exit 1
            fi
          done

      - run: pnpm build
      - run: pnpm browsers --with-deps
      - run: pnpm test
      - run: pnpm demo

      # -r skips the private packages (root, e2e, examples) on its own.
      # `access: public` for the scoped packages comes from their publishConfig.
      - run: pnpm publish -r --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
