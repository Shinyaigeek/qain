name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A release tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm has no undo.
      - name: Tag matches the version of every published package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for pkg in core playwright vitest storybook cli; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$TAG" != "v$version" ]; then
              echo "::error::release tag $TAG does not match packages/$pkg version v$version"
              exit 1
            fi
          done

      - run: pnpm build
      - run: pnpm browsers --with-deps
      - run: pnpm test
      - run: pnpm demo

      # -r skips the private packages (root, e2e, examples) on its own.
      # `access: public` for the scoped packages comes from their publishConfig.
      # TODO: add --provenance back once the repository is public — npm only
      # issues provenance attestations for public source repositories.
      - run: pnpm publish -r --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
