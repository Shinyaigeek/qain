name: qain style diff
description: >-
  Detect qain snapshot baselines changed by a pull request, post one sticky
  comment with the semantic style diff per baseline, keep it updated on every
  push, and delete it when the diff disappears.

inputs:
  pattern:
    description: >-
      Glob(s) selecting the committed snapshot files to watch, one per line.
      Supports **, * and ?.
    required: false
    default: "**/*.qain.json"
  name:
    description: Label for this instance, so several can coexist on one PR.
    required: false
    default: qain
  github-token:
    description: Token used to read PR files and manage the comment (needs pull-requests write).
    required: false
    default: ${{ github.token }}
  fail-on-diff:
    description: >-
      Also fail the check while any watched baseline carries a semantic change.
      Off by default — a committed baseline update is usually intentional, and
      the comment exists to explain it, not to block it.
    required: false
    default: "false"
  qain-cmd:
    description: How to invoke the CLI (needs Node 22+). Override to pin a version or point at a local build.
    required: false
    default: npx --yes @qain/cli
  screenshots:
    description: >-
      Embed before/after/diff renders in the comment. Needs baselines captured
      with `qain snap --replay`, a Chrome on the runner, and `contents: write`
      (the images are committed to the assets branch). Degrades gracefully when
      any of those are missing.
    required: false
    default: "true"
  assets-branch:
    description: Branch the screenshot PNGs are committed to. Created on first use; delete it to purge old images.
    required: false
    default: qain-diff-assets

outputs:
  changed:
    description: "'true' when at least one changed baseline carries a semantic diff."
    value: ${{ steps.run.outputs.changed }}
  total:
    description: Total number of semantic changes across all changed baselines.
    value: ${{ steps.run.outputs.total }}
  files:
    description: "JSON array of the matched files: {path, status, total, primary, derived, contrast}."
    value: ${{ steps.run.outputs.files }}

runs:
  using: composite
  steps:
    - name: Diff changed baselines and sync the comment
      id: run
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        QAIN_PATTERN: ${{ inputs.pattern }}
        QAIN_NAME: ${{ inputs.name }}
        QAIN_CMD: ${{ inputs.qain-cmd }}
        QAIN_SCREENSHOTS: ${{ inputs.screenshots }}
        QAIN_ASSETS_BRANCH: ${{ inputs.assets-branch }}
        QAIN_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { pathToFileURL } = require('node:url')
          const entry = pathToFileURL(process.env.QAIN_ACTION_PATH + '/main.mjs')
          const { run } = await import(entry.href)
          await run({ github, context, core })

    - name: Upload HTML reports
      if: ${{ steps.run.outputs.report == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: qain-report-${{ inputs.name }}
        path: ${{ runner.temp }}/qain-reports/
        retention-days: 14
        if-no-files-found: ignore

    - name: Gate the check
      if: ${{ inputs.fail-on-diff == 'true' && steps.run.outputs.changed == 'true' }}
      shell: bash
      env:
        TOTAL: ${{ steps.run.outputs.total }}
      run: |
        echo "::error::qain found $TOTAL semantic style change(s) in this PR's baselines."
        exit 1
