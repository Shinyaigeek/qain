packages:
  - 'packages/*'
  - 'e2e'
  - 'examples'

catalog:
  playwright-core: ^1.62.1
  '@playwright/test': ^1.62.1

# --- Supply-chain hardening -------------------------------------------------

# Only these packages may run install/lifecycle scripts. Everything else is
# blocked, so a compromised transitive dependency cannot execute code on
# `pnpm install`.
allowBuilds:
  '@biomejs/biome': true
  playwright-core: true
  '@playwright/test': true

# A dependency with an install script that is not listed above fails the
# install outright (ERR_PNPM_IGNORED_BUILDS) rather than being skipped with a
# warning that scrolls past. Every script either gets reviewed and allowed, or
# explicitly denied with `<name>: false`. pnpm's default; pinned on purpose.
strictDepBuilds: true

# Do not adopt a version until it has been on the registry for this many
# minutes (7 days). A malicious release is usually yanked well within a week, so
# the cooldown keeps it out of the lockfile in the first place. The committed
# lockfile is resolved under this policy, so a fresh `pnpm install` reproduces
# it without downgrades.
minimumReleaseAge: 10080

# Refuse a version whose publish trust is weaker than the versions before it.
# A package that has been shipping with provenance / trusted publishing and
# suddenly publishes a release from a bare token is the shape of a maintainer
# account takeover; this fails the install instead of adopting it. Exceptions go
# in `trustPolicyExclude` with a comment and a link.
trustPolicy: no-downgrade

# A transitive dependency may only come from the registry (or a workspace /
# file link). A git URL or a tarball URL deep in the tree is a package nobody
# reviewed under a name the registry would have refused, and it sidesteps the
# cooldown above. Direct dependencies in package.json may still use them — they
# are visible in review. This is pnpm's default; it is pinned here so a future
# default change cannot silently relax it.
blockExoticSubdeps: true

# Verify installed dependencies match the lockfile before running any script,
# and warn on drift instead of silently running against a stale node_modules.
verifyDepsBeforeRun: warn

# `pnpm audit` configuration. Add advisory IDs here (with a comment and a link)
# only to silence a reviewed, non-applicable finding.
auditConfig:
  ignoreGhsas: []
